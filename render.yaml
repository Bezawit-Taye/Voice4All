envVarGroups:
  - name: voice4all-tts-auth
    envVars:
      - key: TTS_SERVICE_TOKEN
        sync: false

services:
  - type: web
    name: voice4all-api
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVarGroups:
      - voice4all-tts-auth
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock_demo
      - key: DEFAULT_LANGUAGE
        value: en
      - key: CORS_ORIGIN
        sync: false
      - key: TTS_SERVICE_URL
        fromService:
          type: web
          name: voice4all-tts
          property: host

  - type: web
    name: voice4all-tts
    runtime: python
    plan: free
    autoDeployTrigger: "off"
    rootDir: backend/tts
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn edge_tts_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVarGroups:
      - voice4all-tts-auth
    envVars:
      - key: NODE_ENV
        value: production
